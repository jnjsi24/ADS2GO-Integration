services:
  - type: web
    name: ads2go-client
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: REACT_APP_API_URL
        value: https://ads2go-server.onrender.com
      - key: REACT_APP_WS_URL
        value: https://ads2go-server.onrender.com
