services:
  - type: web
    name: ads2go-client
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: GENERATE_SOURCEMAP
        value: false
      - key: INLINE_RUNTIME_CHUNK
        value: false
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
      # API Configuration
      - key: REACT_APP_API_URL
        value: https://ads2go-server.onrender.com/graphql
      - key: REACT_APP_GRAPHQL_URL
        value: https://ads2go-server.onrender.com/graphql
      - key: REACT_APP_SERVER_URL
        value: https://ads2go-server.onrender.com
      - key: REACT_APP_CLIENT_URL
        value: https://ads2go-client-dxo4.onrender.com
      - key: REACT_APP_WS_URL
        value: wss://ads2go-server.onrender.com
      # Firebase Configuration
      - key: REACT_APP_FIREBASE_API_KEY
        value: AIzaSyBcJD2Ttm5ykalj-PK8T4ttgodGqVNc-Do
      - key: REACT_APP_FIREBASE_AUTH_DOMAIN
        value: ads2go-6ead4.firebaseapp.com
      - key: REACT_APP_FIREBASE_PROJECT_ID
        value: ads2go-6ead4
      - key: REACT_APP_FIREBASE_STORAGE_BUCKET
        value: ads2go-6ead4.firebasestorage.app
      - key: REACT_APP_FIREBASE_MESSAGING_SENDER_ID
        value: "380830146533"
      - key: REACT_APP_FIREBASE_APP_ID
        value: 1:380830146533:web:86708e4a57a07ab59f590c
      - key: REACT_APP_FIREBASE_MEASUREMENT_ID
        value: G-P0TNVP9BEX
      # Google OAuth Configuration
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 380830146533-v0437o3dvc85i347bapggih30hvnjm1i.apps.googleusercontent.com
      - key: REACT_APP_GOOGLE_REDIRECT_URI
        value: https://ads2go-client-dxo4.onrender.com/auth/google/callback
