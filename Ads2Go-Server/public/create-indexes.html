<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MongoDB Index Manager</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 800px;
      width: 100%;
      padding: 40px;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 32px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }
    
    .info-box {
      background: #f0f7ff;
      border-left: 4px solid #3b82f6;
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 8px;
    }
    
    .info-box h3 {
      color: #1e40af;
      margin-bottom: 10px;
      font-size: 18px;
    }
    
    .info-box p {
      color: #374151;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    
    .performance-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    
    .stat {
      background: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-label {
      color: #6b7280;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    
    .stat-value {
      color: #1f2937;
      font-size: 24px;
      font-weight: bold;
    }
    
    .stat-value.before {
      color: #dc2626;
    }
    
    .stat-value.after {
      color: #059669;
    }
    
    .buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }
    
    button {
      flex: 1;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }
    
    .btn-secondary:hover:not(:disabled) {
      background: #e5e7eb;
    }
    
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 10px;
      display: none;
    }
    
    .result.success {
      background: #ecfdf5;
      border: 1px solid #059669;
      display: block;
    }
    
    .result.error {
      background: #fef2f2;
      border: 1px solid #dc2626;
      display: block;
    }
    
    .result h3 {
      margin-bottom: 15px;
      font-size: 18px;
    }
    
    .result.success h3 {
      color: #059669;
    }
    
    .result.error h3 {
      color: #dc2626;
    }
    
    .result pre {
      background: white;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    
    .index-list {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }
    
    .index-item {
      background: white;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .index-name {
      font-weight: 600;
      color: #1f2937;
    }
    
    .index-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .index-status.created {
      background: #d1fae5;
      color: #065f46;
    }
    
    .index-status.exists {
      background: #fef3c7;
      color: #92400e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 MongoDB Index Manager</h1>
    <p class="subtitle">Optimize database performance with one click</p>
    
    <div class="info-box">
      <h3>📊 Expected Performance Improvement</h3>
      <p>Creating optimized indexes will dramatically speed up database queries for the compliance endpoint.</p>
      
      <div class="performance-stats">
        <div class="stat">
          <div class="stat-label">Before</div>
          <div class="stat-value before">10-23s</div>
        </div>
        <div class="stat">
          <div class="stat-label">After</div>
          <div class="stat-value after">&lt; 1s</div>
        </div>
        <div class="stat">
          <div class="stat-label">Total Improvement</div>
          <div class="stat-value after">~95% ⚡</div>
        </div>
      </div>
    </div>
    
    <div class="buttons">
      <button class="btn-primary" onclick="createIndexes()" id="createBtn">
        <span id="createBtnText">Create Indexes</span>
      </button>
      <button class="btn-secondary" onclick="checkIndexes()" id="checkBtn">
        <span id="checkBtnText">Check Current Indexes</span>
      </button>
    </div>
    
    <div id="result" class="result"></div>
  </div>

  <script>
    async function createIndexes() {
      const btn = document.getElementById('createBtn');
      const btnText = document.getElementById('createBtnText');
      const resultDiv = document.getElementById('result');
      
      btn.disabled = true;
      btnText.innerHTML = '<div class="spinner"></div> Creating indexes...';
      resultDiv.style.display = 'none';
      
      try {
        const response = await fetch('/api/admin/create-indexes');
        const data = await response.json();
        
        if (data.success) {
          resultDiv.className = 'result success';
          resultDiv.innerHTML = `
            <h3>✅ Indexes Created Successfully!</h3>
            <div class="index-list">
              ${data.indexes.map(idx => `
                <div class="index-item">
                  <span class="index-name">${idx.name}</span>
                  <span class="index-status ${idx.status}">${idx.status}</span>
                </div>
              `).join('')}
            </div>
            <p style="margin-top: 20px; color: #059669;">
              <strong>Performance:</strong> Test query completed in ${data.performance.testQueryDuration}ms
            </p>
            <p style="margin-top: 10px; color: #374151; font-size: 14px;">
              🎉 Your compliance endpoint should now load 3-5x faster!
            </p>
          `;
        } else {
          throw new Error(data.message || 'Unknown error');
        }
      } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `
          <h3>❌ Error Creating Indexes</h3>
          <pre>${error.message}</pre>
        `;
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Create Indexes';
      }
    }
    
    async function checkIndexes() {
      const btn = document.getElementById('checkBtn');
      const btnText = document.getElementById('checkBtnText');
      const resultDiv = document.getElementById('result');
      
      btn.disabled = true;
      btnText.innerHTML = '<div class="spinner"></div> Checking...';
      resultDiv.style.display = 'none';
      
      try {
        const response = await fetch('/api/admin/check-indexes');
        const data = await response.json();
        
        if (data.success) {
          resultDiv.className = 'result success';
          resultDiv.innerHTML = `
            <h3>📋 Current Indexes (${data.indexes.length})</h3>
            <div class="index-list">
              ${data.indexes.map(idx => `
                <div class="index-item">
                  <span class="index-name">${idx.name}</span>
                  <code style="font-size: 12px; color: #6b7280;">${JSON.stringify(idx.key)}</code>
                </div>
              `).join('')}
            </div>
            <p style="margin-top: 20px; color: #374151;">
              <strong>Query Performance:</strong> ${data.queryPerformance.duration}ms 
              <span style="color: ${data.queryPerformance.status === 'excellent' ? '#059669' : data.queryPerformance.status === 'good' ? '#d97706' : '#dc2626'}">
                (${data.queryPerformance.status})
              </span>
            </p>
          `;
        } else {
          throw new Error(data.error || 'Unknown error');
        }
      } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `
          <h3>❌ Error Checking Indexes</h3>
          <pre>${error.message}</pre>
        `;
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Check Current Indexes';
      }
    }
  </script>
</body>
</html>
