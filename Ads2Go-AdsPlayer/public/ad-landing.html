<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Information - Ads2Go</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .ad-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .ad-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .ad-details {
            font-size: 14px;
            color: #7f8c8d;
            line-height: 1.5;
        }
        .scan-info {
            background: #e8f5e8;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            border-left: 4px solid #27ae60;
        }
        .scan-time {
            font-size: 12px;
            color: #27ae60;
            font-weight: 600;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .loading {
            display: none;
            color: #7f8c8d;
            font-style: italic;
        }
        
        /* Custom Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 16px;
        }
        .modal-message {
            font-size: 16px;
            color: #5a6c7d;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn-cancel {
            background: #e8e8e8;
            color: #5a6c7d;
        }
        .modal-btn-cancel:hover {
            background: #d0d0d0;
        }
        .modal-btn-confirm {
            background: #3498db;
            color: white;
        }
        .modal-btn-confirm:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱 Ads2Go</div>
        
        <div class="ad-info">
            <div class="ad-title" id="adTitle">Loading Ad Information...</div>
            <div class="ad-details" id="adDetails">
                <div>Material ID: <span id="materialId">-</span></div>
                <div>Slot Number: <span id="slotNumber">-</span></div>
                <div>Ad ID: <span id="adId">-</span></div>
            </div>
        </div>

        <div class="scan-info">
            <div>✅ QR Code Scanned Successfully!</div>
            <div class="scan-time" id="scanTime">Just now</div>
        </div>

        <div class="action-buttons">
            <a href="#" class="btn btn-primary" id="learnMoreBtn">Learn More</a>
            <a href="#" class="btn btn-secondary" id="closeBtn">Close</a>
        </div>

        <div class="loading" id="loading">Tracking scan...</div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content">
            <div class="modal-title">Close Page?</div>
            <div class="modal-message">Would you like to close this page?</div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" id="modalCancelBtn">Cancel</button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirmBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-content">
            <div class="modal-title">Notice</div>
            <div class="modal-message" id="alertMessage"></div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-confirm" id="alertOkBtn">OK</button>
            </div>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const adId = urlParams.get('adId') || 'Unknown';
        const materialId = urlParams.get('materialId') || 'Unknown';
        const slotNumber = urlParams.get('slotNumber') || 'Unknown';
        const timestamp = urlParams.get('timestamp') || Date.now();

        // Update the page content
        document.getElementById('adTitle').textContent = `Ad: ${adId}`;
        document.getElementById('materialId').textContent = materialId;
        document.getElementById('slotNumber').textContent = slotNumber;
        document.getElementById('adId').textContent = adId;
        document.getElementById('scanTime').textContent = new Date(parseInt(timestamp)).toLocaleString();

        // Track the scan
        async function trackScan() {
            try {
                // Update this URL to match your server's API endpoint
                const apiUrl = (window.EXPO_PUBLIC_API_URL || 'http://192.168.1.7:5000') + '/ads/qr-scan';
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        adId: adId,
                        materialId: materialId,
                        slotNumber: slotNumber,
                        timestamp: timestamp,
                        userAgent: navigator.userAgent,
                        url: window.location.href
                    })
                });
                
                if (response.ok) {
                    console.log('QR scan tracked successfully');
                } else {
                    console.log('Failed to track QR scan');
                }
            } catch (error) {
                console.error('Error tracking QR scan:', error);
                // Don't show error to user, just log it
            }
        }

        // Track the scan when page loads
        trackScan();

        // Button handlers
        // Custom alert function
        function showAlert(message) {
            document.getElementById('alertMessage').textContent = message;
            document.getElementById('alertModal').classList.add('show');
        }
        
        function hideAlert() {
            document.getElementById('alertModal').classList.remove('show');
        }
        
        document.getElementById('learnMoreBtn').addEventListener('click', function(e) {
            e.preventDefault();
            // You can customize this to redirect to a specific landing page
            showAlert('This would redirect to the advertiser\'s website or more information about the ad.');
        });
        
        // Alert modal close handler
        document.getElementById('alertOkBtn').addEventListener('click', function() {
            hideAlert();
        });
        
        // Close alert modal when clicking outside
        document.getElementById('alertModal').addEventListener('click', function(e) {
            if (e.target === document.getElementById('alertModal')) {
                hideAlert();
            }
        });

        document.getElementById('closeBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.close();
        });

        // Modal functionality
        const confirmModal = document.getElementById('confirmModal');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        
        function showModal() {
            confirmModal.classList.add('show');
        }
        
        function hideModal() {
            confirmModal.classList.remove('show');
        }
        
        modalConfirmBtn.addEventListener('click', function() {
            hideModal();
            window.close();
        });
        
        modalCancelBtn.addEventListener('click', function() {
            hideModal();
        });
        
        // Close modal when clicking outside
        confirmModal.addEventListener('click', function(e) {
            if (e.target === confirmModal) {
                hideModal();
            }
        });
        
        // Auto-show modal after 10 seconds if no interaction
        setTimeout(() => {
            showModal();
        }, 10000);
    </script>
</body>
</html>
